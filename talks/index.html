<main class="wrap"><form class="searchbox" role="search" onsubmit="return false"><input id="query" type="search" aria-label="Search talks" placeholder="Search by topic or title…" autocomplete="off"><select id="languageFilter" aria-label="Filter by video language"><option value="all" data-en="All languages" data-ar="كل اللغات">All languages</option><option value="ar" data-en="Arabic videos" data-ar="محاضرات بالعربية">Arabic videos</option><option value="en" data-en="English videos" data-ar="محاضرات بالإنجليزية">English videos</option><option value="undetermined" data-en="Unclassified language" data-ar="لغة غير محددة">Unclassified language</option></select><select id="dateFilter" aria-label="Filter by date"><option value="all" data-en="Any date" data-ar="كل التواريخ">Any date</option><option value="today" data-en="Added today" data-ar="أضيف اليوم">Added today</option><option value="week" data-en="Last 7 days" data-ar="آخر ٧ أيام">Last 7 days</option><option value="month" data-en="Last 30 days" data-ar="آخر ٣٠ يومًا">Last 30 days</option></select><select id="sort" aria-label="Sort talks"><option value="new" data-en="Newest added first" data-ar="الأحدث إضافةً">Newest added first</option><option value="old" data-en="Oldest added first" data-ar="الأقدم إضافةً">Oldest added first</option><option value="title" data-en="Title A–Z" data-ar="حسب العنوان">Title A–Z</option></select></form><section class="section"><div class="meta"><h2 data-en="Browse talks" data-ar="تصفح المحاضرات">Browse talks</h2><span class="count" id="count" aria-live="polite">Loading talks…</span></div><div class="topics" id="topics" aria-label="Filter by topic"></div><div id="results" aria-live="polite"></div></section></main>

<script>
let lang="en",filter="all",talks=[],topicCatalog=[];const $=id=>document.getElementById(id);const tr=(en,ar)=>lang==="ar"?ar:en;const safe=s=>String(s??"");const date=d=>{const dt=new Date(d+"T12:00:00Z");return isNaN(dt)?d:new Intl.DateTimeFormat(lang==="ar"?"ar":"en",{year:"numeric",month:"short",day:"numeric",timeZone:"UTC"}).format(dt)};
function topic(t){return lang==="ar"?(t.topic_ar||t.topic):t.topic}function title(t){return lang==="ar"?(t.title_ar||t.title):t.title}function desc(t){return lang==="ar"?(t.description_ar||t.description||""):(t.description||"")}
function element(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
function play(t){$("playerTitle").textContent=title(t);$("frame").replaceChildren();const f=document.createElement("iframe");f.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(t.youtube_id)+"?autoplay=1";f.title=title(t);f.allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share";f.allowFullscreen=true;f.referrerPolicy="strict-origin-when-cross-origin";$("frame").append(f);$("player").showModal()}
$("close").onclick=()=>$("player").close();$("player").addEventListener("close",()=>$("frame").replaceChildren());$("player").addEventListener("click",e=>{if(e.target===$("player"))$("player").close()});
function render(){const topics=topicCatalog.length?topicCatalog.map(t=>t.id):[...new Set(talks.map(t=>t.topic))].sort();$("topics").replaceChildren();const all=element("button","chip"+(filter==="all"?" active":""),tr("All topics","كل المواضيع"));all.type="button";all.onclick=()=>{filter="all";render()};$("topics").append(all);for(const tp of topics){const t=topicCatalog.find(x=>x.id===tp);const count=talks.filter(x=>(x.topic_id||x.topic)===tp).length;const b=element("button","chip"+(filter===tp?" active":""),(t?(lang==="ar"?t.name_ar:t.name):tp)+" ("+count+")");b.type="button";b.onclick=()=>{filter=tp;render()};$("topics").append(b)}
const q=$("query").value.trim().toLocaleLowerCase();const languageMode=$("languageFilter").value;const dateMode=$("dateFilter").value;const today=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());const dayStart=new Date(today+"T12:00:00Z");let list=talks.filter(t=>{const days=Math.round((dayStart-new Date(t.date_added+"T12:00:00Z"))/86400000);return (dateMode==="all"||(dateMode==="today"&&days===0)||(dateMode==="week"&&days>=0&&days<7)||(dateMode==="month"&&days>=0&&days<30))}).filter(t=>(languageMode==="all"||(t.language||"undetermined")===languageMode)).filter(t=>(filter==="all"||(t.topic_id||t.topic)===filter)&&[t.title,t.title_ar,t.topic,t.topic_ar,t.description,t.description_ar,t.date_added,t.id,t.youtube_id].some(v=>safe(v).toLocaleLowerCase().includes(q)));const sort=$("sort").value;list.sort((a,b)=>sort==="title"?title(a).localeCompare(title(b)):sort==="old"?a.date_added.localeCompare(b.date_added):b.date_added.localeCompare(a.date_added));$("count").textContent=list.length+" "+tr(list.length===1?"talk":"talks","محاضرة");$("results").replaceChildren();if(!list.length&&(q||dateMode!=="all"||filter!=="all"||languageMode!=="all")){$("results").append(element("div","empty",tr("No talks match your search. Try a different topic or keyword.","لا توجد محاضرات مطابقة. جرّب موضوعًا أو كلمة أخرى.")));return}
const groups=new Map();for(const t of list){const key=t.topic_id||t.topic;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t)}const ordered=topicCatalog.length?topicCatalog.map(t=>t.id).filter(id=>filter==="all"||id===filter):[...groups.keys()];for(const tp of ordered){const items=groups.get(tp)||[];if(q&&!items.length)continue;const group=element("section","group"),head=element("div","grouphead"),heading=element("h3","",items.length?topic(items[0]):(()=>{const t=topicCatalog.find(x=>x.id===tp);return t?(lang==="ar"?t.name_ar:t.name):tp})());head.append(heading);group.append(head);if(!items.length){group.append(element("div","empty",tr("Coming soon — talks will be added here.","قريبًا — ستُضاف المحاضرات هنا.")));}for(const section of [{id:"ar",en:"Arabic",ar:"العربية"},{id:"en",en:"English",ar:"الإنجليزية"},{id:"undetermined",en:"Language not yet classified",ar:"اللغة لم تحدد بعد"}]){if(languageMode!=="all"&&languageMode!==section.id)continue;const sectionItems=items.filter(t=>(t.language||"undetermined")===section.id);if(section.id==="undetermined"&&!sectionItems.length)continue;const sub=element("h4","",tr(section.en,section.ar)+" ("+sectionItems.length+")");sub.style.cssText="margin:18px 0 12px;color:#17624e;font-size:16px";group.append(sub);if(!sectionItems.length){const empty=element("div","empty",tr("Coming soon","قريبًا"));empty.style.padding="18px";group.append(empty)}for(const t of sectionItems){const row=element("article","talk"),thumb=element("button","thumb");thumb.type="button";thumb.setAttribute("aria-label",tr("Play ","تشغيل ")+title(t));const img=document.createElement("img");img.src="https://i.ytimg.com/vi/"+encodeURIComponent(t.youtube_id)+"/hqdefault.jpg";img.alt="";img.loading="lazy";thumb.append(img,element("span","play","▶"));thumb.onclick=()=>play(t);row.id=t.id;for(const legacy of t.legacy_ids||[]){const alias=element("span");alias.id=legacy;row.append(alias)}const info=element("div");info.append(element("h4","",title(t)),element("p","",desc(t)));const details=element("div","details");details.append(element("span","tag",topic(t)),element("span","",tr("Date added: ","تاريخ الإضافة: ")+date(t.date_added)));const watch=element("button","watch",tr("Watch video ↗","شاهد الفيديو ←"));watch.type="button";watch.onclick=()=>play(t);details.append(watch);const anchor=element("a","watch",tr("Copy link ↗","نسخ الرابط ←"));anchor.href="#"+encodeURIComponent(t.id);anchor.style.marginInlineStart="12px";anchor.addEventListener("click",e=>{e.preventDefault();const url=location.origin+location.pathname+"#"+encodeURIComponent(t.id);history.replaceState(null,"",url);navigator.clipboard?.writeText(url).then(()=>{anchor.textContent=tr("Link copied ✓","تم نسخ الرابط ✓")}).catch(()=>{anchor.textContent=tr("Link ready in address bar","الرابط في شريط العنوان")})});details.append(anchor);const stamp=element("div","details",tr("Talk ID: ","معرّف المحاضرة: ")+t.id+" · "+tr("Recorded: ","تاريخ التسجيل: ")+(t.created_at||t.date_added));stamp.style.marginTop="9px";info.append(details,stamp);row.append(thumb,info);group.append(row)}}$("results").append(group)}}
function setLang(next){lang=next;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("lang").textContent=lang==="en"?"العربية":"English";document.querySelectorAll("[data-en]").forEach(el=>{const value=el.dataset[lang];if(el.tagName==="OPTION")el.textContent=value;else el.textContent=value});$("query").placeholder=tr("Search by topic or title…","ابحث حسب الموضوع أو العنوان…");render()}
$("lang").onclick=()=>setLang(lang==="en"?"ar":"en");$("query").oninput=render;$("sort").onchange=render;$("dateFilter").onchange=render;$("languageFilter").onchange=render;
fetch("../data/talks.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Failed to load");return r.json()}).then(d=>{topicCatalog=Array.isArray(d.topics)?d.topics:[];talks=Array.isArray(d.talks)?d.talks.filter(t=>/^[A-Za-z0-9_-]{11}$/.test(t.youtube_id)&&/^\d{4}-\d{2}-\d{2}$/.test(t.date_added)):[];render();if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el){el.scrollIntoView({block:"center"});el.style.outline="2px solid #ddbd82"}}}).catch(()=>{$("count").textContent=tr("Unavailable","غير متاح");$("results").replaceChildren(element("div","empty",tr("Unable to load talks. Please try again later.","تعذر تحميل المحاضرات. يرجى المحاولة لاحقًا.")))});
</script></body></html>
