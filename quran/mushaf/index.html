<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hudaia · مصحف التجويد</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717}
main{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden}
#spread{position:absolute;inset:0;display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;gap:2px}
canvas{display:block;max-width:100%;max-height:100%;object-fit:contain;touch-action:pan-y;box-sizing:border-box}canvas[hidden]{display:none!important}@media(orientation:portrait){#spread{display:grid!important;place-items:center start!important;position:absolute;inset:0;width:100%;height:100%}#spread #first{position:static!important;transform:none!important;margin:0!important;justify-self:start!important;align-self:center!important}#spread #second{display:none!important}}
#prev,#next{position:fixed;top:0;bottom:0;width:18%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:2}
#prev{left:0}#next{right:0}#prev:focus-visible,#next:focus-visible{outline:2px solid #a4cbbb;outline-offset:-4px}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:16px system-ui;padding:20px;box-sizing:border-box;background:#171717}
#status[hidden]{display:none}#close{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:5;width:38px;height:38px;border:0;border-radius:50%;background:#17171799;color:#fff;font:24px system-ui;cursor:pointer}
</style></head><body><main><div id="spread"><canvas id="first" aria-label="Right Quran page · الصفحة اليمنى"></canvas><canvas id="second" aria-label="Left Quran page · الصفحة اليسرى" hidden></canvas></div></main><button id="close" aria-label="Return to Quran Reader · العودة إلى صفحة القرآن" title="Return to Quran Reader · العودة إلى صفحة القرآن">×</button><button id="prev" aria-label="Next Quran page · الصفحة التالية"></button><button id="next" aria-label="Previous Quran page · الصفحة السابقة"></button><div id="status" role="status">جاري تحميل المصحف · Loading Mushaf…</div>
<script type="module">
const starts=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const params=new URLSearchParams(location.search),raw=Number(params.get("page"));let page=Number.isInteger(raw)&&raw>=1&&raw<=604?raw:1;
document.getElementById("close").onclick=()=>{location.href="../?page="+page};const first=document.getElementById("first"),second=document.getElementById("second"),status=document.getElementById("status");
const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
const cache=new Map();let renderSeq=0;
function landscape(){return matchMedia("(orientation: landscape)").matches}
function spreadStart(n){return landscape()?Math.floor((n-1)/2)*2+1:n}
async function getPage(n){const idx=starts.findIndex((v,i)=>n>=v&&(i===29||n<starts[i+1]));if(!cache.has(idx)){const filename="tajwid-hafs-juz-"+String(idx+1).padStart(2,"0")+".pdf";const task=pdfjs.getDocument({url:new URL(filename,location.href).href});cache.set(idx,task.promise)}const doc=await cache.get(idx);return doc.getPage(n-starts[idx]+1)}
async function renderPage(n,canvas,slots,seq){const pg=await getPage(n);if(seq!==renderSeq)return;const base=pg.getViewport({scale:1}),bounds=document.querySelector("main").getBoundingClientRect(),scale=Math.min((bounds.width-(slots===2?4:0))/slots/base.width,bounds.height/base.height),dpr=Math.min(devicePixelRatio||1,2);const view=pg.getViewport({scale:scale*dpr});const temp=document.createElement("canvas");temp.width=Math.ceil(view.width);temp.height=Math.ceil(view.height);await pg.render({canvasContext:temp.getContext("2d"),viewport:view}).promise;if(seq!==renderSeq)return;canvas.width=temp.width;canvas.height=temp.height;canvas.style.width=view.width/dpr+"px";canvas.style.height=view.height/dpr+"px";canvas.getContext("2d").drawImage(temp,0,0)}
async function showPage(){const seq=++renderSeq;page=spreadStart(page);const two=landscape()&&page<604;second.hidden=!two;second.style.display=two?"block":"none";document.title="الصفحة "+page+(two?"–"+(page+1):"")+" | Hudaia";history.replaceState(null,"","?page="+page);status.hidden=false;status.textContent="جاري تحميل المصحف · Loading Quran…";
try{await Promise.all([renderPage(page,first,two?2:1,seq),...(two?[renderPage(page+1,second,2,seq)]:[])]);if(seq===renderSeq)status.hidden=true}catch(e){if(seq===renderSeq){status.textContent="تعذر عرض صفحة المصحف · Unable to display Quran page. "+(e?.message||"");console.error(e)}}}
function go(delta){const step=landscape()?2:1;const next=Math.max(1,Math.min(604,page+delta*step));if(next===page)return;page=next;showPage()}
document.getElementById("prev").onclick=()=>go(1);document.getElementById("next").onclick=()=>go(-1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(1);if(e.key==="ArrowRight")go(-1)});
let x=0,y=0;const spread=document.getElementById("spread");spread.addEventListener("touchstart",e=>{if(e.touches.length===1){x=e.touches[0].clientX;y=e.touches[0].clientY}},{passive:true});spread.addEventListener("touchend",e=>{if(e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?-1:1)},{passive:true});
let mouseStart=null;
spread.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;mouseStart={x:e.clientX,y:e.clientY};});
spread.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse"||!mouseStart)return;const dx=e.clientX-mouseStart.x,dy=e.clientY-mouseStart.y;mouseStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx>0?1:-1)});
spread.addEventListener("pointercancel",()=>{mouseStart=null});
spread.addEventListener("dragstart",e=>e.preventDefault());
window.addEventListener("resize",()=>showPage());window.addEventListener("popstate",()=>{const n=Number(new URLSearchParams(location.search).get("page"));if(Number.isInteger(n)&&n>=1&&n<=604){page=n;showPage()}});showPage();
</script></body></html>
