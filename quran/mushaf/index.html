<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hudaia · مصحف التجويد</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717}
main{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100%;object-fit:contain;touch-action:pan-y}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:16px system-ui;padding:20px;box-sizing:border-box;background:#171717}
#status[hidden]{display:none}
</style></head><body><main><canvas id="page" aria-label="صفحة المصحف · Quran page"></canvas></main><div id="status" role="status">جاري تحميل المصحف · Loading Mushaf…</div>
<script type="module">
const starts=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const params=new URLSearchParams(location.search);
const raw=Number(params.get("page")),page=Number.isInteger(raw)&&raw>=1&&raw<=604?raw:1;
const idx=starts.findIndex((v,i)=>page>=v&&(i===29||page<starts[i+1]));
const localPage=page-starts[idx]+1;
const filename="tajwid-hafs-juz-"+String(idx+1).padStart(2,"0")+".pdf";
document.title="جزء "+(idx+1)+" · الصفحة "+page+" | Hudaia";
const canvas=document.getElementById("page"),status=document.getElementById("status");
try{
 const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
 pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
 const doc=await pdfjs.getDocument({url:new URL(filename,location.href).href}).promise;
 const pg=await doc.getPage(localPage);
 const base=pg.getViewport({scale:1});
 const scale=Math.min(innerWidth/base.width,innerHeight/base.height);
 const dpr=Math.min(devicePixelRatio||1,2);
 const view=pg.getViewport({scale:scale*dpr});
 canvas.width=Math.ceil(view.width);canvas.height=Math.ceil(view.height);
 canvas.style.width=(view.width/dpr)+"px";canvas.style.height=(view.height/dpr)+"px";
 await pg.render({canvasContext:canvas.getContext("2d"),viewport:view}).promise;
 status.hidden=true;
}catch(e){status.textContent="تعذر عرض صفحة المصحف · Unable to display Quran page. "+(e?.message||"");console.error(e)}
</script></body></html>
