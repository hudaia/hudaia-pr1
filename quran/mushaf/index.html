<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hudaia · مصحف التجويد</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717}
main{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden}
#spread{position:absolute;inset:0;display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;gap:2px}
canvas{display:block;max-width:100%;max-height:100%;object-fit:contain;touch-action:pan-y;box-sizing:border-box}canvas[hidden]{display:none!important}#spread.single{display:grid!important;place-items:center start!important;position:absolute;inset:0;width:100%;height:100%}#spread.single #first{position:static!important;transform:none!important;margin:0!important;justify-self:start!important;align-self:center!important}#spread.single #second{display:none!important}
#prev,#next{position:fixed;top:0;bottom:0;width:18%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:2}
#prev{left:0}#next{right:0}#prev:focus-visible,#next:focus-visible{outline:2px solid #a4cbbb;outline-offset:-4px}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:16px system-ui;padding:20px;box-sizing:border-box;background:#171717}
#status[hidden]{display:none}#controls{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:6;display:flex;gap:6px}#controls button{min-height:38px;border:0;border-radius:9px;padding:6px 10px;background:#171717bb;color:white;font:14px system-ui;cursor:pointer}#controls button:focus-visible{outline:2px solid #a4cbbb}#close{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:5;width:38px;height:38px;border:0;border-radius:50%;background:#17171799;color:#fff;font:24px system-ui;cursor:pointer}

/* Fill the available screen height when switching PDF view modes; preserve page aspect ratio. */
#spread{overflow-x:auto;overflow-y:hidden;justify-content:flex-start;align-items:center;scrollbar-width:none}
#spread::-webkit-scrollbar{display:none}
#spread canvas{max-width:none!important;max-height:none!important;flex-shrink:0}
#spread.single{display:flex!important;justify-content:flex-start!important;align-items:center!important;overflow-x:auto!important}
#spread.single #first{flex-shrink:0!important;align-self:center!important}
\n#spread.pdf-page-enter{animation:pdf-page-enter .18s ease-out}@keyframes pdf-page-enter{from{opacity:.65}to{opacity:1}}@media(prefers-reduced-motion:reduce){#spread.pdf-page-enter{animation:none}}\n\n/* Keep the entire PDF page in the phone viewport, without horizontal clipping. */\n#spread.single{justify-content:center!important;overflow-x:hidden!important}#spread.single #first{margin:auto!important;align-self:center!important;flex-shrink:0!important}#spread:not(.single){justify-content:center!important;overflow-x:hidden!important}\n</style></head><body><main><div id="spread"><canvas id="first" aria-label="Right Quran page · الصفحة اليمنى"></canvas><canvas id="second" aria-label="Left Quran page · الصفحة اليسرى" hidden></canvas></div></main><div id="controls"><button id="view-mode" type="button" aria-label="Toggle single or two-page view · تبديل عرض صفحة أو صفحتين">▣ 1</button><button id="fullscreen" type="button" aria-label="Toggle fullscreen · ملء الشاشة">⛶</button></div><button id="close" aria-label="Return to Quran Reader · العودة إلى صفحة القرآن" title="Return to Quran Reader · العودة إلى صفحة القرآن">×</button><button id="prev" aria-label="Next Quran page · الصفحة التالية"></button><button id="next" aria-label="Previous Quran page · الصفحة السابقة"></button><div id="status" role="status">جاري تحميل المصحف · Loading Mushaf…</div>
<script type="module">
const starts=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const lastPageKey="hudaia-quran-last-page",pdfLastPageKey="hudaia-quran-pdf-last-page";const params=new URLSearchParams(location.search);let savedPage=1;try{const n=Number(localStorage.getItem(pdfLastPageKey)||localStorage.getItem(lastPageKey));if(Number.isInteger(n)&&n>=1&&n<=604)savedPage=n}catch(e){}const raw=Number(params.get("page"));let page=params.get("resume")==="1"?savedPage:(params.has("page")&&Number.isInteger(raw)&&raw>=1&&raw<=604?raw:savedPage);
document.getElementById("close").onclick=()=>{try{localStorage.setItem(lastPageKey,String(page));localStorage.setItem(pdfLastPageKey,String(page))}catch(e){}location.href="../?reader=1&page="+page};const first=document.getElementById("first"),second=document.getElementById("second"),status=document.getElementById("status");
const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
let renderSeq=0;const modeKey="hudaia-mushaf-view-mode";let mode="auto";try{const saved=localStorage.getItem(modeKey);if(["single","double"].includes(saved))mode=saved}catch(e){}
function twoPageMode(){return mode==="double"||(mode==="auto"&&matchMedia("(orientation: landscape)").matches)}
function spreadStart(n){return twoPageMode()?Math.floor((n-1)/2)*2+1:n}
function updateControls(){const two=twoPageMode(),button=document.getElementById("view-mode");button.textContent=two?"▣ 2":"▣ 1";button.title=two?"Two pages · صفحتان — switch to single":"Single page · صفحة واحدة — switch to two";button.setAttribute("aria-pressed",String(two));const full=Boolean(document.fullscreenElement);document.getElementById("fullscreen").textContent=full?"⤢":"⛶";document.getElementById("fullscreen").title=full?"Exit fullscreen · خروج":"Fullscreen · ملء الشاشة"}
document.getElementById("view-mode").onclick=()=>{mode=twoPageMode()?"single":"double";try{localStorage.setItem(modeKey,mode)}catch(e){}showPage()};
document.getElementById("fullscreen").onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{document.getElementById("fullscreen").title="Fullscreen unavailable in this browser · غير مدعوم في هذا المتصفح"}}catch(e){console.warn("Fullscreen unavailable",e)}updateControls()};document.addEventListener("fullscreenchange",()=>{updateControls();showPage()});window.addEventListener("resize",()=>{renderEpoch++;bitmapCache.clear();bitmapPending.clear();showPage()});
function juzIndex(n){return starts.findIndex((v,i)=>n>=v&&(i===29||n<starts[i+1]))}let fileGeneration=0;const fileLoads=new Map();function getPdfFile(idx){if(idx<0||idx>=starts.length)return Promise.reject(Error("Invalid Juz"));if(fileLoads.has(idx))return fileLoads.get(idx).promise;const filename="tajwid-hafs-juz-"+String(idx+1).padStart(2,"0")+".pdf";const task=pdfjs.getDocument({url:new URL(filename,location.href).href});const promise=task.promise.catch(e=>{if(fileLoads.get(idx)?.task===task)fileLoads.delete(idx);throw e});fileLoads.set(idx,{task,promise});return promise}async function retainAdjacentFiles(n,two){const active=new Set([juzIndex(n)]);if(two&&n<604)active.add(juzIndex(n+1));const previous=Math.min(...active)-1,next=Math.max(...active)+1;const keep=new Set([...active,previous,next].filter(i=>i>=0&&i<30));for(const [idx,entry] of fileLoads){if(!keep.has(idx)){fileLoads.delete(idx);entry.task.destroy().catch(()=>{})}}for(const idx of keep)getPdfFile(idx).catch(()=>{})}async function getPage(n){const idx=juzIndex(n),doc=await getPdfFile(idx);return doc.getPage(n-starts[idx]+1)}function pageDimensions(){const bounds=document.querySelector("main").getBoundingClientRect();return {height:Math.max(1,Math.round(bounds.height)),dpr:Math.min(devicePixelRatio||1,1.6)}}async function renderPage(n){const pg=await getPage(n),base=pg.getViewport({scale:1}),{height,dpr}=pageDimensions(),view=pg.getViewport({scale:height/base.height*dpr});const canvas=document.createElement("canvas");canvas.width=Math.ceil(view.width);canvas.height=Math.ceil(view.height);await pg.render({canvasContext:canvas.getContext("2d",{alpha:false}),viewport:view}).promise;return canvas}function paintPage(target,source,two=false){target.width=source.width;target.height=source.height;const bounds=document.querySelector("main").getBoundingClientRect(),maxWidth=two?Math.max(1,(bounds.width-2)/2):bounds.width,scale=Math.min(bounds.height/source.height,maxWidth/source.width);target.style.width=Math.floor(source.width*scale)+"px";target.style.height=Math.floor(source.height*scale)+"px";target.getContext("2d",{alpha:false}).drawImage(source,0,0)}async function showPage(){const seq=++renderSeq;page=spreadStart(page);const two=twoPageMode()&&page<604,spread=document.getElementById("spread");document.title="الصفحة "+page+(two?"–"+(page+1):"")+" | Hudaia";history.replaceState(null,"","?page="+page);try{localStorage.setItem(lastPageKey,String(page));localStorage.setItem(pdfLastPageKey,String(page))}catch(e){}updateControls();status.hidden=Boolean(first.width);if(!first.width)status.textContent="جاري تحميل المصحف · Loading Quran…";try{const images=await Promise.all([renderPage(page),...(two?[renderPage(page+1)]:[])]);if(seq!==renderSeq)return;spread.classList.toggle("single",!two);second.hidden=!two;second.style.display=two?"block":"none";paintPage(first,images[0],two);if(two)paintPage(second,images[1],two);status.hidden=true;spread.classList.remove("pdf-page-enter");void spread.offsetWidth;spread.classList.add("pdf-page-enter");retainAdjacentFiles(page,two)}catch(e){if(seq===renderSeq){status.hidden=false;status.textContent="تعذر عرض صفحة المصحف · Unable to display Quran page. "+(e?.message||"");console.error(e)}}}
function go(delta){const step=twoPageMode()?2:1;const next=Math.max(1,Math.min(604,page+delta*step));if(next===page)return;page=next;showPage()}
document.getElementById("prev").onclick=()=>go(1);document.getElementById("next").onclick=()=>go(-1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(1);if(e.key==="ArrowRight")go(-1)});
let x=0,y=0;const spread=document.getElementById("spread");spread.addEventListener("touchstart",e=>{if(e.touches.length===1){x=e.touches[0].clientX;y=e.touches[0].clientY}},{passive:true});spread.addEventListener("touchend",e=>{if(e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?-1:1)},{passive:true});
let mouseStart=null;
spread.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;mouseStart={x:e.clientX,y:e.clientY};});
spread.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse"||!mouseStart)return;const dx=e.clientX-mouseStart.x,dy=e.clientY-mouseStart.y;mouseStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx>0?1:-1)});
spread.addEventListener("pointercancel",()=>{mouseStart=null});
spread.addEventListener("dragstart",e=>e.preventDefault());
window.addEventListener("resize",()=>showPage());window.addEventListener("popstate",()=>{const n=Number(new URLSearchParams(location.search).get("page"));if(Number.isInteger(n)&&n>=1&&n<=604){page=n;showPage()}});showPage();
</script></body></html>
